<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Variation 3: Web Components & Shadow DOM</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 25px; background: #fafafa; }
  </style>
</head>
<body>
  <h2>Modern Web Component (Shadow DOM)</h2>
  <p>Notice: Form controls are encapsulated inside a custom element with an open <code>#shadow-root</code>.</p>

  <shadow-registration-form></shadow-registration-form>

  <script>
    class ShadowRegistrationForm extends HTMLElement {
      connectedCallback() {
        const shadow = this.attachShadow({ mode: 'open' });
        shadow.innerHTML = `
          <style>
            .box { background: white; padding: 20px; border-radius: 8px; border: 1px solid #ddd; max-width: 500px; }
            .grp { margin-bottom: 15px; }
            label { display: block; margin-bottom: 5px; font-weight: bold; }
            input[type="text"], select { width: 100%; padding: 8px; box-sizing: border-box; }
          </style>
          <div class="box">
            <div class="grp">
              <label for="shadow_fname">First Name</label>
              <input type="text" id="shadow_fname" name="shadow_firstname" placeholder="Enter first name" />
            </div>
            <div class="grp">
              <label>Gender</label>
              <div>
                <label><input type="radio" name="shadow_gender" value="Male" /> Male</label>
                <label><input type="radio" name="shadow_gender" value="Female" /> Female</label>
              </div>
            </div>
            <div class="grp">
              <label for="shadow_state">State</label>
              <select id="shadow_state" name="shadow_state">
                <option value="">Select</option>
                <option value="United States">United States</option>
                <option value="France">France</option>
              </select>
            </div>
          </div>
        `;
      }
    }
    customElements.define('shadow-registration-form', ShadowRegistrationForm);
  </script>
</body>
</html>
